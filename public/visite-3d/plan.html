<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Visite 3D · Villa Marguerite</title>
<script>
/* ?embed : intégré dans le site (titre masqué) · ?theme=light|dark · ?room=ch3 */
(() => { const q = new URLSearchParams(location.search), d = document.documentElement;
  if (q.has('embed')) d.classList.add('embed');
  const t = q.get('theme'); if (t === 'light' || t === 'dark') d.dataset.theme = t; })();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --scene:#dfe4df;
  --ink:#1d2b27;
  --ink-soft:#52615c;
  --paper:rgba(250,250,246,.88);
  --paper-solid:#fafaf6;
  --line:rgba(29,43,39,.13);
  --accent:#2e5145;
  --brass:#a7834a;
  --label-bg:rgba(250,250,246,.92);
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --scene:#1c2321; --ink:#e6ece9; --ink-soft:#a7b4af; --paper:rgba(31,40,37,.86); --paper-solid:#1f2825;
    --line:rgba(230,236,233,.14); --accent:#9cc3b2; --brass:#d1ad72; --label-bg:rgba(31,40,37,.9);
  }
}
:root[data-theme="dark"]{
  --scene:#1c2321; --ink:#e6ece9; --ink-soft:#a7b4af; --paper:rgba(31,40,37,.86); --paper-solid:#1f2825;
  --line:rgba(230,236,233,.14); --accent:#9cc3b2; --brass:#d1ad72; --label-bg:rgba(31,40,37,.9);
}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;height:100%;overflow:hidden;background:var(--scene);color:var(--ink);
  font-family:"Schibsted Grotesk",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  -webkit-font-smoothing:antialiased;}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;outline:none}
button{font:inherit;color:inherit}
button:focus-visible,.room:focus-visible{outline:2px solid var(--brass);outline-offset:2px}

.panel{background:var(--paper);backdrop-filter:blur(14px) saturate(1.2);-webkit-backdrop-filter:blur(14px) saturate(1.2);
  border:1px solid var(--line);box-shadow:0 10px 30px -18px rgba(20,30,27,.45)}

/* Title */
#head{position:fixed;left:calc(16px + env(safe-area-inset-left,0px));top:calc(16px + env(safe-area-inset-top,0px));
  padding:14px 18px 13px;border-radius:14px;max-width:min(340px,calc(100vw - 120px))}
#head h1{margin:0;font-size:1.25rem;line-height:1.15;font-weight:700;letter-spacing:-.01em}
#head p{margin:.3rem 0 0;font-size:.85rem;line-height:1.4;color:var(--ink-soft)}

/* Floor selector: a small section cut of the house */
#floors{position:fixed;right:calc(16px + env(safe-area-inset-right,0px));top:50%;transform:translateY(-50%);
  display:flex;flex-direction:column;align-items:stretch;gap:6px;padding:10px;border-radius:18px;width:196px}
.arrow{height:40px;border-radius:10px;border:1px solid var(--line);background:transparent;cursor:pointer;
  display:grid;place-items:center;transition:background .15s}
.arrow:hover:not(:disabled){background:var(--line)}
.arrow:disabled{opacity:.3;cursor:default}
.arrow svg{width:18px;height:18px}
#stack{display:flex;flex-direction:column;gap:4px;padding:4px 0}
.lvl{display:flex;align-items:center;gap:10px;border:0;background:transparent;cursor:pointer;padding:6px 6px;border-radius:9px;text-align:left}
.lvl:hover{background:var(--line)}
.lvl .shape{flex:0 0 38px;height:22px;position:relative}
.lvl .shape i{position:absolute;inset:0;border:1.5px solid var(--ink-soft);border-radius:2px;transition:background .2s,border-color .2s}
.lvl[data-l="3"] .shape i{clip-path:polygon(0 100%,0 55%,22% 0,78% 0,100% 55%,100% 100%);border:0;background:var(--ink-soft)}
.lvl[data-l="3"] .shape i::after{content:"";position:absolute;inset:1.5px;clip-path:inherit;background:var(--paper-solid)}
.lvl .shape.half{height:14px;margin-left:12px;flex-basis:26px;margin-right:0}
.lvl .txt{display:flex;flex-direction:column;line-height:1.15}
.lvl .txt b{font-size:.86rem;font-weight:600;white-space:nowrap}
.lvl .txt small{white-space:nowrap}
.lvl .txt small{font-size:.72rem;color:var(--ink-soft)}
.lvl.on .shape i{background:var(--brass);border-color:var(--brass)}
.lvl[data-l="3"].on .shape i{background:var(--brass)}
.lvl[data-l="3"].on .shape i::after{background:var(--brass)}
.lvl.on .txt b{color:var(--ink)}

/* Rooms of the current floor */
#rooms{position:fixed;left:calc(16px + env(safe-area-inset-left,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));
  border-radius:14px;padding:12px;max-width:min(560px,calc(100vw - 230px))}
#rooms h2{margin:0 4px 8px;font-size:.8rem;font-weight:600;color:var(--ink-soft)}
#roomlist{display:flex;flex-wrap:wrap;gap:6px}
.room{border:1px solid var(--line);background:transparent;border-radius:999px;padding:6px 11px;font-size:.82rem;cursor:pointer;white-space:nowrap}
.room span{color:var(--ink-soft);margin-left:6px;font-variant-numeric:tabular-nums}
.room:hover{border-color:var(--accent)}
.room.on{background:var(--accent);border-color:var(--accent);color:var(--paper-solid)}
.room.on span{color:inherit;opacity:.8}

/* View tools */
#tools{position:fixed;right:calc(16px + env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));
  display:flex;gap:6px;padding:8px;border-radius:14px}
.tool{min-width:40px;height:40px;border-radius:10px;border:1px solid var(--line);background:transparent;cursor:pointer;
  display:grid;place-items:center;padding:0 10px;font-size:.82rem;font-weight:500}
.tool:hover{background:var(--line)}
.tool[aria-pressed="true"]{background:var(--ink);color:var(--paper-solid);border-color:var(--ink)}
.tool svg{width:18px;height:18px}

#hint{position:fixed;left:50%;top:calc(18px + env(safe-area-inset-top,0px));transform:translateX(-50%);font-size:.8rem;color:var(--ink-soft);
  padding:8px 14px;border-radius:999px;transition:opacity .6s;pointer-events:none;white-space:nowrap}
#hint.gone{opacity:0}

/* 3D labels */
#labels{position:fixed;inset:0;pointer-events:none;overflow:hidden}
.lab{position:absolute;left:0;top:0;transform:translate(-50%,-50%);background:var(--label-bg);border:1px solid var(--line);
  border-radius:8px;padding:4px 8px 3px;font-size:.76rem;line-height:1.2;text-align:center;white-space:nowrap;
  box-shadow:0 6px 16px -10px rgba(0,0,0,.4);transition:opacity .25s}
.lab b{display:block;font-weight:600}
.lab small{color:var(--ink-soft);font-variant-numeric:tabular-nums}
#labels.off .lab{opacity:0}

#loading{position:fixed;inset:0;display:grid;place-items:center;background:var(--scene);z-index:5;transition:opacity .5s}
#loading p{font-size:.9rem;color:var(--ink-soft)}
#loading.done{opacity:0;pointer-events:none}

@media (max-width:720px){
  #head{padding:10px 13px;border-radius:12px}
  #head h1{font-size:1.05rem}
  #head p{font-size:.78rem}
  #floors{width:auto;top:auto;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:none;padding:7px;gap:4px;border-radius:14px}
  .lvl .txt{display:none}
  .lvl{justify-content:center;padding:6px}
  .arrow{height:34px}
  #rooms{left:calc(10px + env(safe-area-inset-left,0px));right:calc(10px + env(safe-area-inset-right,0px));max-width:none;
    bottom:calc(10px + env(safe-area-inset-bottom,0px));padding:8px}
  #rooms h2{display:none}
  #roomlist{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none}
  #tools{bottom:auto;top:calc(12px + env(safe-area-inset-top,0px));right:calc(10px + env(safe-area-inset-right,0px));flex-direction:column;padding:6px}
  #tools .wide{display:none}
  #hint{display:none}
  .lab{font-size:.68rem;padding:3px 6px}
}
.embed #head{display:none}
.embed #hint{top:calc(16px + env(safe-area-inset-top,0px))}
@media (prefers-reduced-motion: reduce){ *{transition:none!important} }
</style>
</head>
<body>
<canvas id="c" tabindex="0" aria-label="Maquette 3D de la maison, faites glisser pour tourner"></canvas>
<div id="labels"></div>

<header id="head" class="panel">
  <h1>Villa Marguerite</h1>
  <p>24 rue Victor Hugo, Pontoise. Seules les parties louées sont modélisées.</p>
</header>

<nav id="floors" class="panel" aria-label="Changer d'étage">
  <button class="arrow" id="up" aria-label="Étage supérieur" title="Étage supérieur (flèche haut)">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 15l6-6 6 6"/></svg>
  </button>
  <div id="stack">
    <button class="lvl" data-l="3"><span class="shape"><i></i></span><span class="txt"><b>2e étage</b><small>Chambre 6</small></span></button>
    <button class="lvl" data-l="2"><span class="shape"><i></i></span><span class="txt"><b>1er étage</b><small>Chambres 1 à 4</small></span></button>
    <button class="lvl" data-l="1"><span class="shape half"><i></i></span><span class="txt"><b>Demi-étage</b><small>Chambre 5</small></span></button>
    <button class="lvl" data-l="0"><span class="shape"><i></i></span><span class="txt"><b>Rez-de-chaussée</b><small>Cuisine, salon</small></span></button>
  </div>
  <button class="arrow" id="down" aria-label="Étage inférieur" title="Étage inférieur (flèche bas)">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>
  </button>
</nav>

<section id="rooms" class="panel" aria-label="Pièces de l'étage">
  <h2 id="roomtitle">Pièces</h2>
  <div id="roomlist"></div>
</section>

<div id="tools" class="panel">
  <button class="tool" id="zin" aria-label="Zoomer" title="Zoomer"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button>
  <button class="tool" id="zout" aria-label="Dézoomer" title="Dézoomer"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 12h14"/></svg></button>
  <button class="tool" id="reset" aria-label="Recentrer la vue" title="Recentrer la vue"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/></svg></button>
  <button class="tool wide" id="cut" aria-pressed="false" title="Couper les murs à mi-hauteur">Murs bas</button>
  <button class="tool wide" id="labtog" aria-pressed="true" title="Afficher les noms des pièces">Noms</button>
</div>

<div id="hint" class="panel">Glisser pour tourner, molette ou pincement pour zoomer, clic droit pour déplacer</div>
<div id="loading"><p>Construction de la maison…</p></div>

<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';

/* ---------------- renderer / scene ---------------- */
const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
renderer.setSize(window.innerWidth, window.innerHeight, false);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.shadowMap.autoUpdate = false;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = .92;
renderer.outputColorSpace = THREE.SRGBColorSpace;
const ANISO = Math.min(8, renderer.capabilities.getMaxAnisotropy());

const scene = new THREE.Scene();
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(renderer), 0.04).texture;
scene.environmentIntensity = 0.38;

function sceneColor() { return getComputedStyle(document.documentElement).getPropertyValue('--scene').trim() || '#dfe4df'; }
scene.background = new THREE.Color(sceneColor());
scene.fog = new THREE.Fog(scene.background, 55, 120);
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => {
  scene.background.set(sceneColor()); scene.fog.color.set(sceneColor());
});

const camera = new THREE.PerspectiveCamera(38, window.innerWidth / window.innerHeight, 0.1, 400);

/* ---------------- seeded random ---------------- */
let _s = 987654321;
const rnd = () => { _s |= 0; _s = (_s + 0x6D2B79F5) | 0; let t = Math.imul(_s ^ (_s >>> 15), 1 | _s); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
const rr = (a, b) => a + (b - a) * rnd();
const seeded = (seed, fn) => { const s = _s; _s = seed; fn(); _s = s; };
const hashKey = (a, b, c = 0) => ((Math.round(a) * 73856093) ^ (Math.round(b) * 19349663) ^ (c * 83492791)) | 0;

/* ---------------- procedural textures ---------------- */
function cv(w, h = w) { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; }
function T(c, { rep = null, rot = 0, srgb = true } = {}) {
  const t = new THREE.CanvasTexture(c); t.wrapS = t.wrapT = THREE.RepeatWrapping;
  if (srgb) t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = ANISO;
  if (rep) t.repeat.set(rep[0], rep[1]); if (rot) { t.center.set(.5, .5); t.rotation = rot; }
  return t;
}
const hsl = (h, s, l, a = 1) => `hsla(${h},${s}%,${l}%,${a})`;
function speckle(g, w, h, amt, count, dark = .5) {
  for (let i = 0; i < count; i++) {
    g.fillStyle = rnd() < dark ? `rgba(0,0,0,${rnd() * amt})` : `rgba(255,255,255,${rnd() * amt})`;
    g.fillRect(rnd() * w, rnd() * h, 1 + rnd() * 2, 1 + rnd() * 2);
  }
}
function plank(g, x, y, w, h, base, vertical) {
  const [H, S, L] = base; const l = L + rr(-7, 7);
  g.fillStyle = hsl(H + rr(-3, 3), S + rr(-6, 6), l); g.fillRect(x, y, w, h);
  g.save(); g.beginPath(); g.rect(x, y, w, h); g.clip();
  const lines = 7 + rnd() * 9;
  for (let i = 0; i < lines; i++) {
    g.strokeStyle = hsl(H, S, l - rr(6, 15), rr(.12, .4)); g.lineWidth = rr(.5, 1.7); g.beginPath();
    if (vertical) { let px = x + rnd() * w; g.moveTo(px, y); for (let yy = y; yy <= y + h + 6; yy += 6) { px += rr(-.7, .7); g.lineTo(px, yy); } }
    else { let py = y + rnd() * h; g.moveTo(x, py); for (let xx = x; xx <= x + w + 6; xx += 6) { py += rr(-.7, .7); g.lineTo(xx, py); } }
    g.stroke();
  }
  if (rnd() < .12) { g.fillStyle = hsl(H, S, l - 16, .45); g.beginPath(); g.ellipse(x + rnd() * w, y + rnd() * h, vertical ? w * .18 : 7, vertical ? 7 : h * .18, 0, 0, 7); g.fill(); }
  const grd = vertical ? g.createLinearGradient(x, 0, x + w, 0) : g.createLinearGradient(0, y, 0, y + h);
  grd.addColorStop(0, 'rgba(255,255,255,.06)'); grd.addColorStop(1, 'rgba(0,0,0,.06)'); g.fillStyle = grd; g.fillRect(x, y, w, h);
  g.restore();
  g.strokeStyle = 'rgba(25,14,6,.55)'; g.lineWidth = 1.3; g.strokeRect(x + .5, y + .5, w - 1, h - 1);
}
function parquetStrips(base, plankW = .075, period = 1.2) {
  const N = 1024, c = cv(N), g = c.getContext('2d');
  const cols = Math.round(period / plankW), pw = N / cols, pxm = N / period;
  for (let i = 0; i < cols; i++) {
    const start = -rnd() * pxm; let y = start; const lens = [];
    while (y < start + N - 1) { let len = rr(.45, 1.15) * pxm; if (y + len > start + N - .3 * pxm) len = start + N - y; lens.push([y, len]); y += len; }
    for (const [yy, len] of lens) {
      const sd = hashKey(i, ((yy % N) + N) % N, 1);
      for (const sh of [-N, 0, N]) if (yy + sh < N && yy + sh + len > 0) seeded(sd, () => plank(g, i * pw, yy + sh, pw, len, base, true));
    }
  }
  return c;
}
function herringbone(base, plankLen = .46) {
  const N = 1024, c = cv(N), g = c.getContext('2d');
  const L = N / 2, W = N / 8; // period = 2 plank lengths
  for (let k = -4; k <= 4; k++) for (let i = -14; i <= 22; i++) {
    const x0 = k * L + i * W, y0 = -k * L + i * W;
    const pieces = [[x0, y0, L, W, false], [x0, y0 + W, W, L, true]];
    for (const [x, y, w, h, v] of pieces) {
      if (x > N + 4 || y > N + 4 || x + w < -4 || y + h < -4) continue;
      const sd = hashKey(((x % N) + N) % N, ((y % N) + N) % N, v ? 3 : 2);
      seeded(sd, () => plank(g, x, y, w, h, base, v));
    }
  }
  return { c, period: plankLen * 2 };
}
function cementTile() { // kitchen: grey-blue quatrefoil, 20 cm tile, canvas = 2x2 tiles
  const N = 512, c = cv(N), g = c.getContext('2d'), s = N / 2;
  for (let ty = 0; ty < 2; ty++) for (let tx = 0; tx < 2; tx++) {
    const x = tx * s, y = ty * s; g.save(); g.beginPath(); g.rect(x, y, s, s); g.clip();
    g.fillStyle = '#e8e6df'; g.fillRect(x, y, s, s);
    g.fillStyle = '#7f949e';
    for (const [cx, cy] of [[x, y], [x + s, y], [x, y + s], [x + s, y + s]]) { g.beginPath(); g.arc(cx, cy, s * .34, 0, 7); g.fill(); }
    g.fillStyle = '#e8e6df';
    for (const [cx, cy] of [[x, y], [x + s, y], [x, y + s], [x + s, y + s]]) { g.beginPath(); g.arc(cx, cy, s * .2, 0, 7); g.fill(); }
    g.fillStyle = '#56707c';
    for (const [cx, cy] of [[x, y], [x + s, y], [x, y + s], [x + s, y + s]]) { g.beginPath(); g.arc(cx, cy, s * .1, 0, 7); g.fill(); }
    const m = [x + s / 2, y + s / 2];
    g.fillStyle = '#9fb1b8';
    for (const [dx, dy] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) { g.beginPath(); g.ellipse(m[0] + dx * s * .13, m[1] + dy * s * .13, dx ? s * .12 : s * .07, dy ? s * .12 : s * .07, 0, 0, 7); g.fill(); }
    g.fillStyle = '#56707c'; g.beginPath(); g.moveTo(m[0], m[1] - s * .09); g.lineTo(m[0] + s * .09, m[1]); g.lineTo(m[0], m[1] + s * .09); g.lineTo(m[0] - s * .09, m[1]); g.fill();
    speckle(g, N, N, .05, 300);
    g.restore(); g.strokeStyle = '#c7c3b9'; g.lineWidth = 2.5; g.strokeRect(x, y, s, s);
  }
  return c;
}
function encausticTile() { // vestibule: cream / black / oxblood, 17 cm
  const N = 512, c = cv(N), g = c.getContext('2d'), s = N / 2;
  for (let ty = 0; ty < 2; ty++) for (let tx = 0; tx < 2; tx++) {
    const x = tx * s, y = ty * s, m = [x + s / 2, y + s / 2];
    g.save(); g.beginPath(); g.rect(x, y, s, s); g.clip();
    g.fillStyle = '#e4d8bd'; g.fillRect(x, y, s, s);
    g.fillStyle = '#26211e';
    g.beginPath(); for (let i = 0; i < 8; i++) { const a = i * Math.PI / 4 + Math.PI / 8, r = s * .44; g.lineTo(m[0] + Math.cos(a) * r, m[1] + Math.sin(a) * r); } g.fill();
    g.fillStyle = '#e4d8bd';
    g.beginPath(); for (let i = 0; i < 8; i++) { const a = i * Math.PI / 4 + Math.PI / 8, r = s * .37; g.lineTo(m[0] + Math.cos(a) * r, m[1] + Math.sin(a) * r); } g.fill();
    g.fillStyle = '#8f3326';
    for (let i = 0; i < 4; i++) { const a = i * Math.PI / 2; g.beginPath(); g.ellipse(m[0] + Math.cos(a) * s * .17, m[1] + Math.sin(a) * s * .17, s * .14, s * .07, a, 0, 7); g.fill(); }
    g.fillStyle = '#26211e'; g.beginPath(); g.arc(m[0], m[1], s * .07, 0, 7); g.fill();
    g.fillStyle = '#8f3326'; for (const [cx, cy] of [[x, y], [x + s, y], [x, y + s], [x + s, y + s]]) { g.save(); g.translate(cx, cy); g.rotate(Math.PI / 4); g.fillRect(-s * .12, -s * .12, s * .24, s * .24); g.restore(); }
    speckle(g, N, N, .06, 400);

  hang(3, frame(.36, .28, artK('marine'), std({ color: '#a4532d', roughness: .5 })), .3, 11.06, 0, 1.4);
  P(3, deskTurned(), 2.4, 11.3, 0); P(3, chairUph('#33363b'), 2.4, 11.82, N);
  P(3, sBed({ base: '#5d6066', duvet: '#f4f3ef' }), 2.24, 12.7, Wd);
  P(3, chevetMetal(), 2.97, 13.45, Wd); P(3, grp(g => lampOn(g, 0, 0, 0, '#7b2f63', MAT.chrome, .32, .1)), 2.97, 13.45, 0, .55);
  P(3, radiatorPanel(), 2.3, 15.3, N);
  P(3, plant('palm', .8), 4.55, 9.0, 0); P(3, bookcase({ w: .8, h: .9, d: .3 }), -.6, 9.75, 0);
}

/* =================== LIGHTS =================== */
scene.add(new THREE.HemisphereLight('#f4f1ea', '#7d7662', .5));
const sun = new THREE.DirectionalLight('#fff1dc', 2.3);
sun.position.set(-14, 26, 26); sun.target.position.set(-2, 0, 9);
sun.castShadow = true; sun.shadow.mapSize.set(4096, 4096);
Object.assign(sun.shadow.camera, { left: -17, right: 17, top: 17, bottom: -17, near: 5, far: 80 });
sun.shadow.bias = -.0004; sun.shadow.normalBias = .03; sun.shadow.radius = 3;
scene.add(sun, sun.target);
const fill = new THREE.DirectionalLight('#dfe8ff', .45); fill.position.set(18, 14, -10); scene.add(fill);

/* =================== CONTROLS / VIEW =================== */
const controls = new OrbitControls(camera, canvas);
controls.enableDamping = true; controls.dampingFactor = .08;
controls.minDistance = 2.5; controls.maxDistance = 45; controls.maxPolarAngle = 84 * deg; controls.screenSpacePanning = true;
controls.zoomToCursor = true;
const VIEW = [
  { t: [1.4, .6, 7.8], d: 19 },
  { t: [-2.6, 4.7, 10.0], d: 23 },
  { t: [2.4, 3.6, 2.6], d: 13, dir: [.45, 1.3, -.75] },
  { t: [1.0, 7.8, 13.0], d: 13, dir: [.35, 1.3, -.8] },
];
const ORD = [0, 2, 1, 3]; // display order from bottom: RDC, demi-étage, 1er, 2e
let lvl = 0;
const DIR = new THREE.Vector3(.5, 1.25, .9).normalize();
let active = 0, tween = null;
function flyTo(target, dist, dir = null, dur = .9) {
  const d = dir || camera.position.clone().sub(controls.target).normalize();
  if (d.y < .25) { d.y = .25; d.normalize(); }
  tween = { t0: performance.now(), dur: dur * 1000, ft: controls.target.clone(), fp: camera.position.clone(), tt: new THREE.Vector3(...target), tp: new THREE.Vector3(...target).addScaledVector(d, dist) };
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) tween.dur = 1;
}
const cutPlane = new THREE.Plane(new THREE.Vector3(0, -1, 0), 1.3);
renderer.localClippingEnabled = true;
let cutOn = false, labelsOn = true;
const floorMats = new Set();
floors.forEach(f => f.traverse(o => { if (o.material) (Array.isArray(o.material) ? o.material : [o.material]).forEach(m => floorMats.add(m)); }));
function applyCut() {
  cutPlane.constant = FL[active].y + 1.6;
  for (const m of floorMats) { if (m.userData.side0 === undefined) m.userData.side0 = m.side; m.clippingPlanes = cutOn ? [cutPlane] : null; m.clipShadows = true; m.side = cutOn ? THREE.DoubleSide : m.userData.side0; m.needsUpdate = true; }
  for (const m of [revealMat, MAT.wallCap, ..._pm.values()]) m.side = cutOn ? THREE.DoubleSide : THREE.FrontSide;
  renderer.shadowMap.needsUpdate = true;
}
function setFloor(i, fly = true) {
  lvl = Math.max(0, Math.min(3, i)); active = ORD[lvl];
  floors.forEach((g, k) => g.visible = ORD.indexOf(k) <= lvl);
  privateBlock.visible = lvl >= 2; atticBlock.visible = lvl >= 3;
  document.querySelectorAll('.lvl').forEach(b => { const on = +b.dataset.l === lvl; b.classList.toggle('on', on); b.setAttribute('aria-pressed', on); });
  document.getElementById('up').disabled = lvl === 3; document.getElementById('down').disabled = lvl === 0;
  buildRoomList(); applyCut();
  if (fly) flyTo(VIEW[active].t, VIEW[active].d, new THREE.Vector3(...(VIEW[active].dir || DIR.toArray())).normalize());
  renderer.shadowMap.needsUpdate = true;
}
/* labels + room list */
const labelBox = document.getElementById('labels');
const LABELS = ROOMS.filter(r => r.lab).map(r => {
  const el = document.createElement('div'); el.className = 'lab'; el.innerHTML = `<b>${r.n}</b>${r.a ? `<small>${/\d/.test(r.a) ? r.a + ' m²' : r.a}</small>` : ''}`; labelBox.appendChild(el);
  return { r, el, p: new THREE.Vector3(r.lab[0], FL[r.f].y + 2.0, r.lab[1]) };
});
function buildRoomList() {
  const list = document.getElementById('roomlist'); list.innerHTML = '';
  document.getElementById('roomtitle').textContent = ['Pièces du rez-de-chaussée', 'Pièces du 1er étage', 'Pièces du demi-étage', 'Pièces du 2e étage'][active];
  for (const r of ROOMS.filter(r => r.f === active && r.lab)) {
    const b = document.createElement('button'); b.className = 'room'; b.dataset.k = r.k; b.innerHTML = `${r.n}${/\d/.test(r.a) ? `<span>${r.a} m²</span>` : ''}`;
    b.onclick = () => { document.querySelectorAll('.room').forEach(x => x.classList.remove('on')); b.classList.add('on'); flyTo([r.lab[0], FL[r.f].y + .6, r.lab[1]], 7.5); };
    list.appendChild(b);
  }
}
const _v = new THREE.Vector3();
function updateLabels() {
  const w = window.innerWidth, h = window.innerHeight;
  for (const L of LABELS) {
    if (L.r.f !== active || !labelsOn) { L.el.style.display = 'none'; continue; }
    _v.copy(L.p); if (cutOn) _v.y = FL[active].y + 1.7;
    _v.project(camera);
    if (_v.z > 1) { L.el.style.display = 'none'; continue; }
    L.el.style.display = 'block'; L.el.style.transform = `translate(${(_v.x * .5 + .5) * w}px, ${(-_v.y * .5 + .5) * h}px) translate(-50%,-50%)`;
  }
}
/* UI wiring */
document.getElementById('up').onclick = () => setFloor(lvl + 1);
document.getElementById('down').onclick = () => setFloor(lvl - 1);
document.querySelectorAll('.lvl').forEach(b => b.onclick = () => setFloor(+b.dataset.l));
const zoomBy = (f) => { const d = camera.position.clone().sub(controls.target); const L = THREE.MathUtils.clamp(d.length() * f, controls.minDistance, controls.maxDistance); flyTo(controls.target.toArray(), L, d.normalize(), .35); };
document.getElementById('zin').onclick = () => zoomBy(.75);
document.getElementById('zout').onclick = () => zoomBy(1.33);
document.getElementById('reset').onclick = () => { document.querySelectorAll('.room').forEach(x => x.classList.remove('on')); flyTo(VIEW[active].t, VIEW[active].d, new THREE.Vector3(...(VIEW[active].dir || DIR.toArray())).normalize()); };
const cutBtn = document.getElementById('cut');
cutBtn.onclick = () => { cutOn = !cutOn; cutBtn.setAttribute('aria-pressed', cutOn); applyCut(); };
const labBtn = document.getElementById('labtog');
labBtn.onclick = () => { labelsOn = !labelsOn; labBtn.setAttribute('aria-pressed', labelsOn); };
window.addEventListener('keydown', (e) => {
  if (e.target.closest && e.target.closest('input,textarea')) return;
  if (e.key === 'ArrowUp' || e.key === 'PageUp') { e.preventDefault(); setFloor(lvl + 1); }
  if (e.key === 'ArrowDown' || e.key === 'PageDown') { e.preventDefault(); setFloor(lvl - 1); }
});
const hint = document.getElementById('hint');
controls.addEventListener('start', () => { tween = null; setTimeout(() => hint.classList.add('gone'), 1200); });
window.addEventListener('resize', () => { camera.aspect = window.innerWidth / window.innerHeight; camera.updateProjectionMatrix(); renderer.setSize(window.innerWidth, window.innerHeight, false); });

/* start */
camera.position.copy(new THREE.Vector3(...VIEW[0].t).addScaledVector(DIR, VIEW[0].d * 1.35));
controls.target.set(...VIEW[0].t);
setFloor(0, false);
flyTo(VIEW[0].t, VIEW[0].d, DIR.clone(), 1.4);
renderer.shadowMap.needsUpdate = true;
const ease = (t) => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
function loop(now) {
  if (tween) {
    const k = Math.min(1, (now - tween.t0) / tween.dur), e = ease(k);
    controls.target.lerpVectors(tween.ft, tween.tt, e); camera.position.lerpVectors(tween.fp, tween.tp, e);
    if (k >= 1) tween = null;
  }
  controls.update();
  renderer.render(scene, camera);
  updateLabels();
  if (!TEST) requestAnimationFrame(loop);
}
const TEST = location.search.includes('test');
if (!TEST) requestAnimationFrame(loop);
else { window.__render = (n = 1) => { for (let i = 0; i < n; i++) loop(performance.now() + 1e7); }; window.__api = { setFloor, flyTo, VIEW, DIR, camera, controls, THREE, applyCut, get cut() { return cutOn; }, set cut(v) { cutOn = v; applyCut(); } }; }
/* pilotage depuis le site : postMessage({ type: 'vm-3d:focus', room: 'ch3' }) ou ?room=ch3 */
function focusRoom(k) {
  const r = ROOMS.find(x => x.k === k && x.lab); if (!r) return false;
  setFloor(ORD.indexOf(r.f), false);
  document.querySelectorAll('.room').forEach(x => x.classList.toggle('on', x.dataset.k === k));
  flyTo([r.lab[0], FL[r.f].y + .6, r.lab[1]], 7.5, null, 1.2);
  return true;
}
window.addEventListener('message', (e) => {
  if (e.origin !== location.origin || !e.data || typeof e.data !== 'object') return;
  if (e.data.type === 'vm-3d:focus') focusRoom(e.data.room);
  if (e.data.type === 'vm-3d:floor') setFloor(+e.data.level);
});
const startRoom = new URLSearchParams(location.search).get('room');
if (startRoom) focusRoom(startRoom);
if (window.parent !== window) window.parent.postMessage({ type: 'vm-3d:ready' }, location.origin);
requestAnimationFrame(() => document.getElementById('loading').classList.add('done'));
window.__ready = true;
</script>
